name: US Free Pre-Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'

permissions:
  contents: read
  actions: read

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-us.txt
      - name: Build US candidate list
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m us_scanner.premarket
      - name: Upload US candidates
        uses: actions/upload-artifact@v4
        with:
          name: us-candidates
          path: us_candidates.csv
          if-no-files-found: error
          retention-days: 2
